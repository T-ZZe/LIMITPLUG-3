name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Compiler
        run: mvn -B package
        working-directory: LimiterPlugin

      - uses: actions/upload-artifact@v4
        with:
          name: LimiterPlugin
          path: LimiterPlugin/target/*.jar
